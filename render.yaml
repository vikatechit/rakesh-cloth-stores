# Rakesh Cloth Stores — GitHub + Render (free web service)
# Frontend + API + SQLite on one Node service. No Hostinger.

services:
  - type: web
    name: rakesh-cloth-stores
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/settings
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
